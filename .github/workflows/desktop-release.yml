          printf '%s  %s\n' \
            "839b14df8a24415e17d15f222e2ac01d3a90845deb39df642e2cc01869140a34" \
            "${python_archive}" |
            shasum -a 256 --check
          printf '%s  %s\n' \
            "b4dd388b14ff20ced93003e31e2be8d486049456161fc1ea393aa7c64a000e17" \
            "${python_hashes}" |
            shasum -a 256 --check
          printf '%s  %s\n' \
            "61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6" \
            "${node_archive}" |
            shasum -a 256 --check
          printf '%s  %s\n' \
            "778ac5b2fcdbd68d9c0ae9f4310674faa3af0910bd0d18e7f6597787c40a3e39" \
            "${node_hashes}" |
            shasum -a 256 --check
          {
            printf 'PYTHON_SIDECAR_ARCHIVE=%s\n' "${python_archive}"
            printf 'PYTHON_SIDECAR_HASH_MANIFEST=%s\n' "${python_hashes}"
            printf 'QMD_NODE_ARCHIVE=%s\n' "${node_archive}"
            printf 'QMD_NODE_HASH_MANIFEST=%s\n' "${node_hashes}"
          } >> "${GITHUB_ENV}"

      - name: Build locked Python sidecar
        run: cd "${LCF_REVIEWED_SOURCE_ROOT}" && make python-sidecar-build

      - name: Validate Python scratch cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup_assertion="runner-temp-present"
          trap 'cleanup_status=$?; printf "lcf-scratch-cleanup: assertion=%s\n" "${cleanup_assertion}" >&2; exit "${cleanup_status}"' ERR
          test -n "${RUNNER_TEMP:-}"
          cleanup_assertion="runner-temp-absolute"
          [[ "${RUNNER_TEMP}" = /* ]]
          cleanup_assertion="runner-temp-directory"
          test -d "${RUNNER_TEMP}"
          cleanup_assertion="runner-temp-not-symlink"
          test ! -L "${RUNNER_TEMP}"
          cleanup_assertion="runner-temp-canonical"
          runner_temp_real="$(cd "${RUNNER_TEMP}" && /bin/pwd -P)"
          test "${runner_temp_real}" = "${RUNNER_TEMP}"
          cleanup_assertion="runner-temp-owner"
          test "$(/usr/bin/stat -f '%u' "${RUNNER_TEMP}")" = "$(/usr/bin/id -u)"
          cleanup_assertion="runner-temp-mode"
          runner_temp_mode="$(/usr/bin/stat -f '%Lp' "${RUNNER_TEMP}")"
          (( (8#${runner_temp_mode} & 0022) == 0 ))
          shopt -s nullglob
          cleanup_assertion="runner-toolchain-residue"
          runner_toolchain_residue=("${RUNNER_TEMP}"/python-sidecar-toolchain-*)
          test "${#runner_toolchain_residue[@]}" -eq 0
          cleanup_assertion="runner-producer-residue"
          runner_producer_residue=("${RUNNER_TEMP}"/lcf-python-producer.*)
          test "${#runner_producer_residue[@]}" -eq 0
          cleanup_assertion="runner-distribution-binding-residue"
          runner_distribution_binding_residue=(
            "${RUNNER_TEMP}"/lcf-python-installer.*
          )
          test "${#runner_distribution_binding_residue[@]}" -eq 0
          cleanup_assertion="runner-source-residue"
          runner_source_residue=("${RUNNER_TEMP}"/lcf-reviewed-source.*)
          if test -z "${LCF_REVIEWED_SOURCE_ROOT:-}"; then
            test "${#runner_source_residue[@]}" -eq 0
          else
            cleanup_assertion="source-root-prefix"
            readonly source_prefix="${RUNNER_TEMP}/lcf-reviewed-source."
            source_suffix="${LCF_REVIEWED_SOURCE_ROOT#"${source_prefix}"}"
            readonly source_suffix
            test "${LCF_REVIEWED_SOURCE_ROOT}" = "${source_prefix}${source_suffix}"
            [[ "${source_suffix}" =~ ^[A-Za-z0-9]{10}$ ]]
            cleanup_assertion="source-root-directory"
            test -d "${LCF_REVIEWED_SOURCE_ROOT}"
            cleanup_assertion="source-root-not-symlink"
            test ! -L "${LCF_REVIEWED_SOURCE_ROOT}"
            cleanup_assertion="source-root-canonical"
            source_root_real="$(cd "${LCF_REVIEWED_SOURCE_ROOT}" && /bin/pwd -P)"
            test "${source_root_real}" = "${LCF_REVIEWED_SOURCE_ROOT}"
            cleanup_assertion="source-root-owner"
            test "$(/usr/bin/stat -f '%u' "${LCF_REVIEWED_SOURCE_ROOT}")" = \
              "$(/usr/bin/id -u)"
            cleanup_assertion="source-root-mode"
            test "$(/usr/bin/stat -f '%Lp' "${LCF_REVIEWED_SOURCE_ROOT}")" = \
              "700"
            readonly provenance_env="${RUNNER_TEMP}/lcf-reviewed-source-provenance.env"
            cleanup_assertion="source-provenance-file"
            test -f "${provenance_env}"
            cleanup_assertion="source-provenance-not-symlink"
            test ! -L "${provenance_env}"
            cleanup_assertion="source-provenance-owner"
            test "$(/usr/bin/stat -f '%u' "${provenance_env}")" = \
              "$(/usr/bin/id -u)"
            cleanup_assertion="runner-source-residue-closure"
            test "${#runner_source_residue[@]}" -eq 2
            for source_residue in "${runner_source_residue[@]}"; do
              case "${source_residue}" in
                "${LCF_REVIEWED_SOURCE_ROOT}"|"${provenance_env}") ;;
                *) false ;;
              esac
            done
            cleanup_assertion="source-root-enter"
            cd "${LCF_REVIEWED_SOURCE_ROOT}"
            cleanup_assertion="repo-fixed-directory-residue"
            test ! -e desktop/generated/python-sidecar-build
            cleanup_assertion="repo-fixed-symlink-residue"
            test ! -L desktop/generated/python-sidecar-build
            cleanup_assertion="repo-random-directory-residue"
            repo_random_residue=(desktop/generated/python-sidecar-build-*)
            test "${#repo_random_residue[@]}" -eq 0
          fi
          trap - ERR

      - name: Validate Python sidecar provenance
        shell: bash
        run: |
          set -euo pipefail
          cd "${LCF_REVIEWED_SOURCE_ROOT}"
          [[ "${LCF_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${LCF_SOURCE_TREE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${LCF_SOURCE_SNAPSHOT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LCF_SOURCE_DATE_EPOCH}" =~ ^[0-9]+$ ]]
          [[ "${LCF_RENDERER_PACKAGE_LOCK_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${LCF_REVIEWED_BUILD_PYTHON}" = \
            "/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13"
          test -f "${LCF_REVIEWED_BUILD_PYTHON}"
          test ! -L "${LCF_REVIEWED_BUILD_PYTHON}"
          test -x "${LCF_REVIEWED_BUILD_PYTHON}"
          test "$("${LCF_REVIEWED_BUILD_PYTHON}" -I -S -c \
            'import os,sys; print(os.path.realpath(sys.executable))')" = \
            "${LCF_REVIEWED_BUILD_PYTHON}"
          test "$("${LCF_REVIEWED_BUILD_PYTHON}" -I -S -c \
            'import platform; print(platform.python_version())')" = "3.13.14"

      - name: Build locked QMD runtime
        run: cd "${LCF_REVIEWED_SOURCE_ROOT}" && make qmd-runtime-build

      - name: Build and stage production renderer
        shell: bash
        run: |
          set -euo pipefail
          cd "${LCF_REVIEWED_SOURCE_ROOT}"
          npm_command="$(command -v npm)"
          node_directory="$(dirname "$(command -v node)")"
          test -x "${npm_command}"
          run_exact_npm_script() (
            local package_root="$1"
            local script_name="$2"
            local npm_home
            readonly npm_home_prefix="${RUNNER_TEMP}/lcf-npm-run-home."
            npm_home="$(
              /usr/bin/mktemp -d \
                "${npm_home_prefix}XXXXXXXXXX"
            )"
            chmod 0700 "${npm_home}"
            cleanup_exact_npm_home() {
              local exit_status=$?
              trap - EXIT
              if [[ "${npm_home}" != "${npm_home_prefix}"* ]] ||
                [[ ! -d "${npm_home}" ]] ||
                [[ -L "${npm_home}" ]]; then
                exit 97
              fi
              rm -rf -- "${npm_home}"
              if [[ -e "${npm_home}" ]] || [[ -L "${npm_home}" ]]; then
                exit 97
              fi
              exit "${exit_status}"
            }
            trap cleanup_exact_npm_home EXIT
            ( umask 077; : > "${npm_home}/global.npmrc" )
            ( umask 077; : > "${npm_home}/user.npmrc" )
            /usr/bin/env -i \
              PATH="${node_directory}:/usr/bin:/bin" \
              HOME="${npm_home}" \
              TMPDIR="${npm_home}" \
              CI=true \
              LCF_FORMAL_RELEASE=true \
              LCF_SOURCE_SHA="${LCF_SOURCE_SHA}" \
              LCF_SOURCE_TREE="${LCF_SOURCE_TREE}" \
              LCF_SOURCE_SNAPSHOT_SHA256="${LCF_SOURCE_SNAPSHOT_SHA256}" \
              LCF_SOURCE_DATE_EPOCH="${LCF_SOURCE_DATE_EPOCH}" \
              LCF_RENDERER_PACKAGE_LOCK_SHA256="${LCF_RENDERER_PACKAGE_LOCK_SHA256}" \
              LCF_REVIEWED_BUILD_PYTHON="${LCF_REVIEWED_BUILD_PYTHON}" \
              LCF_REVIEWED_SOURCE_ROOT="${LCF_REVIEWED_SOURCE_ROOT}" \
              LCF_WEB_NODE_INSTALL_SEAL="${LCF_WEB_NODE_INSTALL_SEAL:-}" \
              NPM_CONFIG_AUDIT=false \
              NPM_CONFIG_CACHE="${npm_home}/cache" \
              NPM_CONFIG_FUND=false \
              NPM_CONFIG_GLOBALCONFIG="${npm_home}/global.npmrc" \
              NPM_CONFIG_IGNORE_SCRIPTS=true \
              NPM_CONFIG_UPDATE_NOTIFIER=false \
              NPM_CONFIG_USERCONFIG="${npm_home}/user.npmrc" \
              "${npm_command}" --prefix "${package_root}" \
              run "${script_name}"
          )
          web_test_seal="${RUNNER_TEMP}/lcf-web-node-test-seal.json"
          web_final_seal="${RUNNER_TEMP}/lcf-web-node-final-seal.json"
          test ! -e "${web_test_seal}"
          test ! -e "${web_final_seal}"
          node tools/exact_node_install.cjs install \
            --package-root web \
            --seal "${web_test_seal}" \
            --npm "${npm_command}"
          run_exact_npm_script web test
          run_exact_npm_script web typecheck
          node tools/exact_node_install.cjs discard-test \
            --package-root web \
            --seal "${web_test_seal}"
          node tools/exact_node_install.cjs install \
            --package-root web \
            --seal "${web_final_seal}" \
            --npm "${npm_command}"
          export LCF_WEB_NODE_INSTALL_SEAL="${web_final_seal}"
          run_exact_npm_script web build:packaging
          node tools/exact_node_install.cjs verify \
            --package-root web \
            --seal "${LCF_WEB_NODE_INSTALL_SEAL}"
          make renderer-stage
          node tools/exact_node_install.cjs verify \
            --package-root web \
            --seal "${LCF_WEB_NODE_INSTALL_SEAL}"
          printf 'LCF_WEB_NODE_INSTALL_SEAL=%s\n' \
            "${LCF_WEB_NODE_INSTALL_SEAL}" >> "${GITHUB_ENV}"

      - name: Build and audit desktop sources
        shell: bash
        run: |
          set -euo pipefail
          cd "${LCF_REVIEWED_SOURCE_ROOT}"
          npm_command="$(command -v npm)"
          node_directory="$(dirname "$(command -v node)")"
          test -x "${npm_command}"
          run_exact_npm_script() (
            local package_root="$1"
            local script_name="$2"
            local npm_home
            readonly npm_home_prefix="${RUNNER_TEMP}/lcf-npm-run-home."
            npm_home="$(
              /usr/bin/mktemp -d \
                "${npm_home_prefix}XXXXXXXXXX"
            )"
            chmod 0700 "${npm_home}"
            cleanup_exact_npm_home() {
              local exit_status=$?
              trap - EXIT
              if [[ "${npm_home}" != "${npm_home_prefix}"* ]] ||
                [[ ! -d "${npm_home}" ]] ||
                [[ -L "${npm_home}" ]]; then
                exit 97
              fi
              rm -rf -- "${npm_home}"
              if [[ -e "${npm_home}" ]] || [[ -L "${npm_home}" ]]; then
                exit 97
              fi
              exit "${exit_status}"
            }
            trap cleanup_exact_npm_home EXIT
            ( umask 077; : > "${npm_home}/global.npmrc" )
            ( umask 077; : > "${npm_home}/user.npmrc" )
            /usr/bin/env -i \
              PATH="${node_directory}:/usr/bin:/bin" \
              HOME="${npm_home}" \
              TMPDIR="${npm_home}" \
              CI=true \
              LCF_FORMAL_RELEASE=true \
              LCF_SOURCE_SHA="${LCF_SOURCE_SHA}" \
              LCF_SOURCE_TREE="${LCF_SOURCE_TREE}" \
              LCF_SOURCE_SNAPSHOT_SHA256="${LCF_SOURCE_SNAPSHOT_SHA256}" \
              LCF_SOURCE_DATE_EPOCH="${LCF_SOURCE_DATE_EPOCH}" \
              LCF_RENDERER_PACKAGE_LOCK_SHA256="${LCF_RENDERER_PACKAGE_LOCK_SHA256}" \
              LCF_REVIEWED_BUILD_PYTHON="${LCF_REVIEWED_BUILD_PYTHON}" \
              LCF_REVIEWED_SOURCE_ROOT="${LCF_REVIEWED_SOURCE_ROOT}" \
              LCF_DESKTOP_NODE_INSTALL_SEAL="${LCF_DESKTOP_NODE_INSTALL_SEAL:-}" \
              NPM_CONFIG_AUDIT=false \
              NPM_CONFIG_CACHE="${npm_home}/cache" \
              NPM_CONFIG_FUND=false \
              NPM_CONFIG_GLOBALCONFIG="${npm_home}/global.npmrc" \
              NPM_CONFIG_IGNORE_SCRIPTS=true \
              NPM_CONFIG_UPDATE_NOTIFIER=false \
              NPM_CONFIG_USERCONFIG="${npm_home}/user.npmrc" \
              "${npm_command}" --prefix "${package_root}" \
              run "${script_name}"
          )
          desktop_test_seal="${RUNNER_TEMP}/lcf-desktop-node-test-seal.json"
          desktop_final_seal="${RUNNER_TEMP}/lcf-desktop-node-final-seal.json"
          test ! -e "${desktop_test_seal}"
          test ! -e "${desktop_final_seal}"
          node tools/exact_node_install.cjs install \
            --package-root desktop \
            --seal "${desktop_test_seal}" \
            --npm "${npm_command}"
          run_exact_npm_script desktop test
          run_exact_npm_script desktop typecheck
          node tools/exact_node_install.cjs discard-test \
            --package-root desktop \
            --seal "${desktop_test_seal}"
          node tools/exact_node_install.cjs install \
            --package-root desktop \
            --seal "${desktop_final_seal}" \
            --npm "${npm_command}"
          export LCF_DESKTOP_NODE_INSTALL_SEAL="${desktop_final_seal}"
          run_exact_npm_script desktop build
          run_exact_npm_script desktop audit:companion
          run_exact_npm_script desktop audit:python-sidecar
          make qmd-runtime-audit
          make renderer-audit
          node tools/exact_node_install.cjs verify \
            --package-root desktop \
            --seal "${LCF_DESKTOP_NODE_INSTALL_SEAL}"
          printf 'LCF_DESKTOP_NODE_INSTALL_SEAL=%s\n' \
            "${LCF_DESKTOP_NODE_INSTALL_SEAL}" >> "${GITHUB_ENV}"

      - name: Sign, package, and assemble formal assets
        shell: bash
        env:
          DESKTOP_RELEASE_CREDENTIAL_BUNDLE_BASE64: ${{ secrets.DESKTOP_RELEASE_CREDENTIAL_BUNDLE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          cd "${LCF_REVIEWED_SOURCE_ROOT}"
          node tools/exact_node_install.cjs verify \
            --package-root web \
            --seal "${LCF_WEB_NODE_INSTALL_SEAL}"
          node tools/exact_node_install.cjs verify \
            --package-root desktop \
            --seal "${LCF_DESKTOP_NODE_INSTALL_SEAL}"
          credential_bundle="${RUNNER_TEMP}/lcf-desktop-release-credentials.json"
          update_key="${RUNNER_TEMP}/lcf-update-metadata-ed25519-private.pem"
          certificate_bundle="${RUNNER_TEMP}/lcf-codesign.p12"
          certificate_password="${RUNNER_TEMP}/lcf-codesign-password.txt"
          certificate_pem="${RUNNER_TEMP}/lcf-codesign-certificate.pem"
          signing_keychain="${RUNNER_TEMP}/lcf-signing.keychain-db"
          release_assets="${RUNNER_TEMP}/lcf-desktop-release-assets"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() {
            security delete-keychain "${signing_keychain}" >/dev/null 2>&1 || true
            rm -f \
              "${credential_bundle}" \
              "${update_key}" \
              "${certificate_bundle}" \
              "${certificate_password}" \
              "${certificate_pem}" \
              "${signing_keychain}"
          }
          trap cleanup EXIT
          printf '%s' "${DESKTOP_RELEASE_CREDENTIAL_BUNDLE_BASE64}" |
            base64 -D > "${credential_bundle}"
          unset DESKTOP_RELEASE_CREDENTIAL_BUNDLE_BASE64
          node - \
            "${credential_bundle}" \
            "${update_key}" \
            "${certificate_bundle}" \
            "${certificate_password}" <<'NODE'
          const fs = require("node:fs");
          const [
            bundlePath,
            updateKeyPath,
            certificatePath,
            passwordPath
          ] = process.argv.slice(2);
          const exact = (value, names) =>
            value !== null &&
            typeof value === "object" &&
            !Array.isArray(value) &&
            Object.keys(value).sort().join("\0") ===
              [...names].sort().join("\0");
          const decode = (value, label, maximum) => {
            if (
              typeof value !== "string" ||
              value.length === 0 ||
              value.length > maximum * 2 ||
              !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value)
            ) {
              throw new Error(`${label} is not canonical base64`);
            }
            const decoded = Buffer.from(value, "base64");
            if (
              decoded.length === 0 ||
              decoded.length > maximum ||
              decoded.toString("base64") !== value
            ) {
              throw new Error(`${label} is not canonical base64`);
            }
            return decoded;
          };
          const bundle = JSON.parse(fs.readFileSync(bundlePath, "utf8"));
          const updateLock = require("./runtime/update-metadata-key.lock.json");
          const certificateLock = require(
            "./runtime/macos-codesign-certificate.lock.json"
          );
          if (
            !exact(bundle, [
              "schemaVersion",
              "credentialGenerationId",
              "repository",
              "environment",
              "updateMetadata",
              "macosCodeSigning"
            ]) ||
            bundle.schemaVersion !== 1 ||
            !/^[0-9a-f]{32}$/.test(bundle.credentialGenerationId || "") ||
            bundle.repository !== "fredgnr/local-context-forge" ||
            bundle.environment !== "macos-signing" ||
            !exact(bundle.updateMetadata, [
              "algorithm",
              "privateKeyPemBase64",
              "publicKeySha256"
            ]) ||
            bundle.updateMetadata.algorithm !== "Ed25519" ||
            !exact(bundle.macosCodeSigning, [
              "identity",
              "certificateP12Base64",
              "certificatePasswordBase64",
              "certificateSha256"
            ]) ||
            bundle.macosCodeSigning.identity !==
              "Local Context Forge Self Signed" ||
            bundle.credentialGenerationId !==
              updateLock.credentialGenerationId ||
            bundle.credentialGenerationId !==
              certificateLock.credentialGenerationId ||
            bundle.updateMetadata.publicKeySha256 !==
              updateLock.publicKeySha256 ||
            bundle.macosCodeSigning.certificateSha256 !==
              certificateLock.certificateSha256
          ) {
            throw new Error(
              "Credential bundle does not match reviewed public pins"
            );
          }
          fs.writeFileSync(
            updateKeyPath,
            decode(
              bundle.updateMetadata.privateKeyPemBase64,
              "Update private key",
              64 * 1024
            ),
            { mode: 0o600, flag: "wx" }
          );
          fs.writeFileSync(
            certificatePath,
            decode(
              bundle.macosCodeSigning.certificateP12Base64,
              "Code-signing certificate",
              1024 * 1024
            ),
            { mode: 0o600, flag: "wx" }
          );
          fs.writeFileSync(
            passwordPath,
            decode(
              bundle.macosCodeSigning.certificatePasswordBase64,
              "Code-signing password",
              1024
            ),
            { mode: 0o600, flag: "wx" }
          );
          NODE
          openssl pkcs12 \
            -in "${certificate_bundle}" \
            -passin "file:${certificate_password}" \
            -clcerts -nokeys \
            -out "${certificate_pem}"
          expected_certificate_sha="$(
            node -p "require('./runtime/macos-codesign-certificate.lock.json').certificateSha256"
          )"
          actual_certificate_sha="$(
            openssl x509 -in "${certificate_pem}" -outform DER |
              shasum -a 256 |
              awk '{print $1}'
          )"
          test "${actual_certificate_sha}" = "${expected_certificate_sha}"
          security create-keychain -p "${keychain_password}" "${signing_keychain}"
          security set-keychain-settings -lut 21600 "${signing_keychain}"
          security unlock-keychain -p "${keychain_password}" "${signing_keychain}"
          security import "${certificate_bundle}" \
            -k "${signing_keychain}" \
            -P "$(cat "${certificate_password}")" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${keychain_password}" \
            "${signing_keychain}"
          node desktop/scripts/prepareRelease.cjs verify-key \
            --tag "${GITHUB_REF_NAME}" \
            --private-key "${update_key}"
          export CSC_NAME="Local Context Forge Self Signed"
          export CSC_KEYCHAIN="${signing_keychain}"
          (
            cd desktop
            ./node_modules/.bin/electron-builder \
              --mac dmg zip \
              --arm64 \
              --config electron-builder.release.yml \
              --publish never
          )
          node desktop/scripts/prepareRelease.cjs assemble \
            --tag "${GITHUB_REF_NAME}" \
            --release-dir "${LCF_REVIEWED_SOURCE_ROOT}/desktop/release" \
            --output-dir "${release_assets}" \
            --private-key "${update_key}"
          node tools/exact_node_install.cjs verify \
            --package-root web \
            --seal "${LCF_WEB_NODE_INSTALL_SEAL}"
          node tools/exact_node_install.cjs verify \
            --package-root desktop \
            --seal "${LCF_DESKTOP_NODE_INSTALL_SEAL}"
          [[ "${LCF_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${LCF_SOURCE_TREE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${LCF_SOURCE_SNAPSHOT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LCF_SOURCE_DATE_EPOCH}" =~ ^[0-9]+$ ]]
          [[ "${LCF_RENDERER_PACKAGE_LOCK_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          "${LCF_REVIEWED_BUILD_PYTHON}" -I -S \
            tools/check_exact_git_provenance.py \
            --expected-tag "${GITHUB_REF_NAME}" > /dev/null
          printf 'LCF_RELEASE_ASSET_DIR=%s\n' "${release_assets}" >> "${GITHUB_ENV}"

      - name: Independently verify assembled assets
        run: >-
          cd "${LCF_REVIEWED_SOURCE_ROOT}" &&
          node desktop/scripts/prepareRelease.cjs verify-assets
          --tag "${GITHUB_REF_NAME}"
          --asset-dir "${LCF_RELEASE_ASSET_DIR}"

      - name: Upload one verified release-asset set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-release-assets
          path: ${{ env.LCF_RELEASE_ASSET_DIR }}
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false

  create_draft:
    name: Create and verify draft release
    needs: build
    if: >-
      github.repository == 'fredgnr/local-context-forge' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out exact release tag without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"

      - name: Bind draft provenance
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF}" = "refs/tags/${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          node desktop/scripts/prepareRelease.cjs preflight \
            --tag "${GITHUB_REF_NAME}"

      - name: Prepare an empty same-run artifact directory
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/lcf-desktop-release-assets"
          test ! -e "${asset_dir}"
          mkdir -m 700 "${asset_dir}"

      - name: Download verified asset set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-release-assets
          path: ${{ runner.temp }}/lcf-desktop-release-assets

      - name: Independently verify downloaded assets
        env:
          LCF_RELEASE_ASSET_DIR: ${{ runner.temp }}/lcf-desktop-release-assets
        run: >-
          node desktop/scripts/prepareRelease.cjs verify-assets
          --tag "${GITHUB_REF_NAME}"
          --asset-dir "${LCF_RELEASE_ASSET_DIR}"

      - name: Create and remotely verify the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LCF_RELEASE_ASSET_DIR: ${{ runner.temp }}/lcf-desktop-release-assets
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          fetch_release_pages() {
            local destination="$1"
            local temporary="${destination}.tmp"
            test ! -e "${destination}"
            test ! -e "${temporary}"
            gh api \
              --paginate \
              --slurp \
              --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "repos/fredgnr/local-context-forge/releases?per_page=100" \
              > "${temporary}"
            test "$(wc -c < "${temporary}")" -le 8388608
            mv "${temporary}" "${destination}"
          }
          select_exact_release() {
            local pages="$1"
            local output="$2"
            local expectation="$3"
            node - "${pages}" "${output}" "${tag}" "${expectation}" <<'NODE'
          const fs = require("node:fs");
          const [pagesPath, outputPath, expectedTag, expectation] =
            process.argv.slice(2);
          const pages = JSON.parse(fs.readFileSync(pagesPath, "utf8"));
          if (
            !Array.isArray(pages) ||
            pages.length === 0 ||
            pages.length > 100 ||
            pages.some(
              (page) =>
                !Array.isArray(page) ||
                page.length > 100 ||
                page.some(
                  (release) =>
                    release === null ||
                    typeof release !== "object" ||
                    Array.isArray(release)
                )
            )
          ) {
            throw new Error("GitHub release pagination is invalid or excessive");
          }
          const matches = pages
            .flat()
            .filter((release) => release.tag_name === expectedTag);
          if (expectation === "absent-or-draft") {
            if (matches.length === 0) {
              process.exit(0);
            }
            if (matches.length !== 1 || matches[0].draft !== true) {
              throw new Error(
                "Existing exact-tag release is not one recoverable Draft"
              );
            }
            fs.writeFileSync(
              outputPath,
              `${JSON.stringify(matches[0])}\n`,
              { encoding: "utf8", flag: "wx", mode: 0o600 }
            );
            process.exit(0);
          }
          if (
            expectation !== "draft" ||
            matches.length !== 1 ||
            matches[0].draft !== true
          ) {
            throw new Error("Expected one exact draft release");
          }
          fs.writeFileSync(
            outputPath,
            `${JSON.stringify(matches[0])}\n`,
            { encoding: "utf8", flag: "wx", mode: 0o600 }
          );
          NODE
          }

          before_pages="${RUNNER_TEMP}/lcf-releases-before-create.json"
          before_json="${RUNNER_TEMP}/lcf-draft-before-create.json"
          fetch_release_pages "${before_pages}"
          select_exact_release \
            "${before_pages}" \
            "${before_json}" \
            "absent-or-draft"

          if [[ -e "${before_json}" ]]; then
            node desktop/scripts/prepareRelease.cjs \
              verify-github-release \
              --tag "${tag}" \
              --asset-dir "${LCF_RELEASE_ASSET_DIR}" \
              --release-json "${before_json}" \
              --expected-state draft \
              --release-notes .github/desktop-release-notes.md
          else
            create_flags=(
              --repo fredgnr/local-context-forge
              --draft
              --verify-tag
              --title "Local Context Forge ${tag}"
              --notes-file .github/desktop-release-notes.md
            )
            tag_without_build_metadata="${tag%%+*}"
            if [[ "${tag_without_build_metadata}" == *-* ]]; then
              create_flags+=(--prerelease)
            fi
            gh release create \
              "${tag}" \
              "${LCF_RELEASE_ASSET_DIR}"/* \
              "${create_flags[@]}"
          fi
          remote_json="${RUNNER_TEMP}/lcf-draft-release.json"
          after_pages="${RUNNER_TEMP}/lcf-releases-after-create.json"
          fetch_release_pages "${after_pages}"
          select_exact_release "${after_pages}" "${remote_json}" "draft"
          node desktop/scripts/prepareRelease.cjs verify-github-release \
            --tag "${tag}" \
            --asset-dir "${LCF_RELEASE_ASSET_DIR}" \
            --release-json "${remote_json}" \
            --expected-state draft \
            --release-notes .github/desktop-release-notes.md

  promote:
    name: Verify and promote an existing draft
    if: >-
      github.repository == 'fredgnr/local-context-forge' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == 'main' &&
      startsWith(inputs.release_tag, 'v') &&
      inputs.confirm_publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: macos-release
    permissions:
      contents: write

    steps:
      - name: Check out the trusted main promotion policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"

      - name: Bind promotion provenance and reviewed candidate
        shell: bash
        env:
          LCF_RELEASE_TAG: ${{ inputs.release_tag }}
          LCF_CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF_TYPE}" = "branch"
          test "${GITHUB_REF_NAME}" = "main"
          test "${GITHUB_REF}" = "refs/heads/main"
          [[ "${LCF_RELEASE_TAG}" =~ ^v[0-9A-Za-z.+-]{1,120}$ ]]
          [[ "${LCF_CANDIDATE_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          initial_main_commit="$(
            git rev-parse refs/remotes/origin/main
          )"
          test "${initial_main_commit}" = "${GITHUB_SHA}"
          git fetch --force --tags origin
          release_ref="refs/lcf-release-tags/${LCF_RELEASE_TAG}"
          git fetch --no-tags origin \
            "+refs/tags/${LCF_RELEASE_TAG}:${release_ref}"
          release_commit="$(git rev-parse "${release_ref}^{commit}")"
          [[ "${release_commit}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor \
            "${release_commit}" \
            "refs/remotes/origin/main"
          node "${GITHUB_WORKSPACE}/desktop/scripts/prepareRelease.cjs" \
            verify-promotion-order \
            --tag "${LCF_RELEASE_TAG}" \
            --expected-commit "${release_commit}" \
            --comparison-commit "${initial_main_commit}"
          source_dir="${RUNNER_TEMP}/lcf-promotion-source"
          test ! -e "${source_dir}"
          git worktree add --detach "${source_dir}" "${release_commit}"
          test "$(git -C "${source_dir}" rev-parse HEAD)" = "${release_commit}"
          test -z "$(git -C "${source_dir}" status --porcelain --untracked-files=all)"
          {
            printf 'LCF_PROMOTION_SOURCE_DIR=%s\n' "${source_dir}"
            printf 'LCF_RELEASE_COMMIT=%s\n' "${release_commit}"
          } >> "${GITHUB_ENV}"
          node "${GITHUB_WORKSPACE}/desktop/scripts/prepareRelease.cjs" \
            preflight \
            --tag "${LCF_RELEASE_TAG}" \
            --source-root "${source_dir}" \
            --expected-commit "${release_commit}"

      - name: Fetch the exact release and download every remote asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LCF_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${LCF_RELEASE_TAG}"
          asset_dir="${RUNNER_TEMP}/lcf-promote-release-assets"
          release_json="${RUNNER_TEMP}/lcf-promotion-release.json"
          asset_list="${RUNNER_TEMP}/lcf-promotion-assets.tsv"
          pages="${RUNNER_TEMP}/lcf-promotion-release-pages.json"
          test ! -e "${asset_dir}"
          test ! -e "${release_json}"
          test ! -e "${asset_list}"
          test ! -e "${pages}"
          mkdir -m 700 "${asset_dir}"
          gh api \
            --paginate \
            --slurp \
            --method GET \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/fredgnr/local-context-forge/releases?per_page=100" \
            > "${pages}"
          test "$(wc -c < "${pages}")" -le 8388608
          release_id="$(
            node - \
              "${pages}" \
              "${release_json}" \
              "${asset_list}" \
              "${tag}" <<'NODE'
          const fs = require("node:fs");
          const [pagesPath, releasePath, assetListPath, expectedTag] =
            process.argv.slice(2);
          const pages = JSON.parse(fs.readFileSync(pagesPath, "utf8"));
          if (
            !Array.isArray(pages) ||
            pages.length === 0 ||
            pages.length > 100 ||
            pages.some(
              (page) =>
                !Array.isArray(page) ||
                page.length > 100 ||
                page.some(
                  (release) =>
                    release === null ||
                    typeof release !== "object" ||
                    Array.isArray(release)
                )
            )
          ) {
            throw new Error("GitHub release pagination is invalid or excessive");
          }
          const matches = pages
            .flat()
            .filter((release) => release.tag_name === expectedTag);
          if (
            matches.length !== 1 ||
            matches[0].draft !== true ||
            !Array.isArray(matches[0].assets) ||
            matches[0].assets.length === 0 ||
            matches[0].assets.length > 64
          ) {
            throw new Error(
              "Expected one exact Draft; an existing published release is a security incident"
            );
          }
          const release = matches[0];
          if (
            !Number.isSafeInteger(release.id) ||
            release.id <= 0
          ) {
            throw new Error("Draft release id is invalid");
          }
          const names = new Set();
          let totalSize = 0;
          const lines = release.assets.map((asset) => {
            const expectedApiUrl =
              "https://api.github.com/repos/fredgnr/" +
              `local-context-forge/releases/assets/${asset.id}`;
            const nameBytes = Buffer.byteLength(asset.name || "", "utf8");
            if (
              !Number.isSafeInteger(asset.id) ||
              asset.id <= 0 ||
              typeof asset.name !== "string" ||
              nameBytes === 0 ||
              nameBytes > 255 ||
              asset.name !== asset.name.normalize("NFC") ||
              asset.name === "." ||
              asset.name === ".." ||
              /[/\\\u0000-\u001f\u007f]/u.test(asset.name) ||
              names.has(asset.name) ||
              asset.url !== expectedApiUrl ||
              asset.state !== "uploaded" ||
              !Number.isSafeInteger(asset.size) ||
              asset.size <= 0 ||
              asset.size > 4 * 1024 * 1024 * 1024
            ) {
              throw new Error("Remote release asset metadata is unsafe");
            }
            names.add(asset.name);
            totalSize += asset.size;
            return `${asset.id}\t${asset.name}`;
          });
          if (!Number.isSafeInteger(totalSize) || totalSize > 8 * 1024 ** 3) {
            throw new Error("Remote release asset set is too large");
          }
          fs.writeFileSync(
            releasePath,
            `${JSON.stringify(release)}\n`,
            { encoding: "utf8", flag: "wx", mode: 0o600 }
          );
          fs.writeFileSync(
            assetListPath,
            `${lines.join("\n")}\n`,
            { encoding: "utf8", flag: "wx", mode: 0o600 }
          );
          process.stdout.write(String(release.id));
          NODE
          )"
          [[ "${release_id}" =~ ^[1-9][0-9]{0,15}$ ]]
          downloaded=0
          while IFS=$'\t' read -r asset_id asset_name; do
            test -n "${asset_id}"
            test -n "${asset_name}"
            target="${asset_dir}/${asset_name}"
            test ! -e "${target}"
            gh api \
              --method GET \
              --header "Accept: application/octet-stream" \
              "repos/fredgnr/local-context-forge/releases/assets/${asset_id}" \
              > "${target}"
            test -s "${target}"
            downloaded="$((downloaded + 1))"
          done < "${asset_list}"
          test "${downloaded}" -gt 0
          {
            printf 'LCF_PROMOTION_ASSET_DIR=%s\n' "${asset_dir}"
            printf 'LCF_PROMOTION_RELEASE_ID=%s\n' "${release_id}"
          } >> "${GITHUB_ENV}"

      - name: Independently verify downloaded remote assets
        env:
          LCF_RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          node "${GITHUB_WORKSPACE}/desktop/scripts/prepareRelease.cjs"
          verify-assets
          --tag "${LCF_RELEASE_TAG}"
          --asset-dir "${LCF_PROMOTION_ASSET_DIR}"
          --source-root "${LCF_PROMOTION_SOURCE_DIR}"
          --expected-commit "${LCF_RELEASE_COMMIT}"

      - name: Verify the draft, publish once, and verify the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LCF_RELEASE_TAG: ${{ inputs.release_tag }}
          LCF_CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
        run: |
          set -euo pipefail
          tag="${LCF_RELEASE_TAG}"
          release_id="${LCF_PROMOTION_RELEASE_ID}"
          release_notes="${LCF_PROMOTION_SOURCE_DIR}/.github/desktop-release-notes.md"
          refresh_remote_tag() {
            local destination="refs/lcf-fresh-release-tags/${tag}"
            if git show-ref --verify --quiet "${destination}"; then
              git update-ref -d "${destination}"
            fi
            git fetch --no-tags origin \
              "+refs/tags/${tag}:${destination}"
            test "$(git rev-parse "${destination}^{commit}")" = \
              "${LCF_RELEASE_COMMIT}"
          }
          fresh_pages="${RUNNER_TEMP}/lcf-pre-publish-release-pages.json"
          fresh_json="${RUNNER_TEMP}/lcf-pre-publish-release.json"
          test ! -e "${fresh_pages}"
          test ! -e "${fresh_json}"
          gh api \
            --paginate \
            --slurp \
            --method GET \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/fredgnr/local-context-forge/releases?per_page=100" \
            > "${fresh_pages}"
          test "$(wc -c < "${fresh_pages}")" -le 8388608
          node - \
            "${fresh_pages}" \
            "${fresh_json}" \
            "${tag}" \
            "${release_id}" <<'NODE'
          const fs = require("node:fs");
          const [pagesPath, outputPath, expectedTag, expectedIdText] =
            process.argv.slice(2);
          const expectedId = Number(expectedIdText);
          const pages = JSON.parse(fs.readFileSync(pagesPath, "utf8"));
          if (
            !Array.isArray(pages) ||
            pages.length === 0 ||
            pages.length > 100 ||
            pages.some(
              (page) =>
                !Array.isArray(page) ||
                page.length > 100 ||
                page.some(
                  (release) =>
                    release === null ||
                    typeof release !== "object" ||
                    Array.isArray(release)
                )
            )
          ) {
            throw new Error("GitHub release pagination is invalid or excessive");
          }
          const matches = pages
            .flat()
            .filter((release) => release.tag_name === expectedTag);
          if (
            !Number.isSafeInteger(expectedId) ||
            expectedId <= 0 ||
            matches.length !== 1 ||
            matches[0].id !== expectedId ||
            matches[0].draft !== true
          ) {
            throw new Error(
              "Exact release is no longer the approved Draft"
            );
          }
          fs.writeFileSync(
            outputPath,
            `${JSON.stringify(matches[0])}\n`,
            { encoding: "utf8", flag: "wx", mode: 0o600 }
          );
          NODE
          refresh_remote_tag
          node "${GITHUB_WORKSPACE}/desktop/scripts/prepareRelease.cjs" \
            verify-github-release \
            --tag "${tag}" \
            --asset-dir "${LCF_PROMOTION_ASSET_DIR}" \
            --release-json "${fresh_json}" \
            --expected-state draft \
            --release-notes "${release_notes}" \
            --candidate-manifest-sha256 \
              "${LCF_CANDIDATE_MANIFEST_SHA256}"

          fresh_main_ref="refs/remotes/lcf-promotion-main"
          git fetch --force --tags origin \
            "+refs/heads/main:${fresh_main_ref}"
          fresh_main_commit="$(git rev-parse "${fresh_main_ref}^{commit}")"
          [[ "${fresh_main_commit}" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor \
            "${GITHUB_SHA}" \
            "${fresh_main_commit}"
          git merge-base --is-ancestor \
            "${LCF_RELEASE_COMMIT}" \
            "${fresh_main_commit}"
          order_json="$(
            node "${GITHUB_WORKSPACE}/desktop/scripts/prepareRelease.cjs" \
              verify-promotion-order \
              --tag "${tag}" \
              --expected-commit "${LCF_RELEASE_COMMIT}" \
              --comparison-commit "${fresh_main_commit}"
          )"
          make_latest="$(
            printf '%s' "${order_json}" |
              node -e '
                const fs = require("node:fs");
                const value = JSON.parse(fs.readFileSync(0, "utf8"));
                if (
                  value === null ||
                  typeof value !== "object" ||
                  !["true", "false"].includes(value.makeLatest)
                ) {
                  throw new Error("Trusted preflight output is invalid");
                }
                process.stdout.write(value.makeLatest);
              '
          )"
          case "${make_latest}" in
            true|false) ;;
            *) printf '%s\n' "Invalid latest-release policy" >&2; exit 2 ;;
          esac
          refresh_remote_tag
          printf '{"draft":false,"make_latest":"%s"}\n' "${make_latest}" |
            gh api \
              --method PATCH \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "repos/fredgnr/local-context-forge/releases/${release_id}" \
              --input -

          refresh_remote_tag
          gh release verify "${tag}" \
            --repo fredgnr/local-context-forge

          published_pages="${RUNNER_TEMP}/lcf-published-release-pages.json"
          published_json="${RUNNER_TEMP}/lcf-published-release.json"
          test ! -e "${published_pages}"
          test ! -e "${published_json}"
          gh api \
            --paginate \
            --slurp \
            --method GET \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "repos/fredgnr/local-context-forge/releases?per_page=100" \
            > "${published_pages}"
          test "$(wc -c < "${published_pages}")" -le 8388608
          node - \
            "${published_pages}" \
            "${published_json}" \
            "${tag}" \
            "${release_id}" <<'NODE'
          const fs = require("node:fs");
          const [pagesPath, outputPath, expectedTag, expectedIdText] =
            process.argv.slice(2);
          const expectedId = Number(expectedIdText);
          const pages = JSON.parse(fs.readFileSync(pagesPath, "utf8"));
          if (
            !Array.isArray(pages) ||
            pages.length === 0 ||
            pages.length > 100 ||
            pages.some(
              (page) =>
                !Array.isArray(page) ||
                page.length > 100 ||
                page.some(
                  (release) =>
                    release === null ||
                    typeof release !== "object" ||
                    Array.isArray(release)
                )
            )
          ) {
            throw new Error("GitHub release pagination is invalid or excessive");
          }
          const matches = pages
            .flat()
            .filter((release) => release.tag_name === expectedTag);
          if (
            !Number.isSafeInteger(expectedId) ||
            expectedId <= 0 ||
            matches.length !== 1 ||
            matches[0].id !== expectedId ||
            matches[0].draft !== false
          ) {
            throw new Error("Expected one exact published release");
          }
          fs.writeFileSync(
            outputPath,
            `${JSON.stringify(matches[0])}\n`,
            { encoding: "utf8", flag: "wx", mode: 0o600 }
          );
          NODE
          node "${GITHUB_WORKSPACE}/desktop/scripts/prepareRelease.cjs" \
            verify-github-release \
            --tag "${tag}" \
            --asset-dir "${LCF_PROMOTION_ASSET_DIR}" \
            --release-json "${published_json}" \
            --expected-state published \
            --release-notes "${release_notes}" \
            --candidate-manifest-sha256 \
              "${LCF_CANDIDATE_MANIFEST_SHA256}"
