name: Engineering smoke bundle assembly

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: engineering-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    name: macOS arm64 engineering-smoke assembly (no App launch)
    if: github.repository == 'fredgnr/local-context-forge'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CI: "true"
      LCF_ENGINEERING_SMOKE: "true"
      LCF_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LCF_GITHUB_CONTEXT_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up reviewed build Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.14"

      - name: Bind exact source provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          [[ "${LCF_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test -n "${RUNNER_TEMP}"
          [[ "${RUNNER_TEMP}" = /* ]]
          test -d "${RUNNER_TEMP}"
          test ! -L "${RUNNER_TEMP}"
          readonly source_prefix="${RUNNER_TEMP}/lcf-reviewed-source."
          reviewed_source="$(
            /usr/bin/mktemp -d "${source_prefix}XXXXXXXXXX"
          )"
          readonly reviewed_source
          chmod 0700 "${reviewed_source}"
          bootstrap_python="$(
            python -I -c 'import os,sys; print(os.path.realpath(sys.executable))'
          )"
          readonly bootstrap_python
          test "${bootstrap_python#/}" != "${bootstrap_python}"
          test -f "${bootstrap_python}"
          test ! -L "${bootstrap_python}"
          test -x "${bootstrap_python}"
          test "$("${bootstrap_python}" -I -c 'import platform; print(platform.python_version())')" = \
            "3.13.14"
          "${bootstrap_python}" -I - "${reviewed_source}" <<'PY'
          import os
          import stat
          import sys

          root = sys.argv[1]
          info = os.lstat(root)
          if (
              not os.path.isabs(root)
              or os.path.realpath(root) != root
              or not stat.S_ISDIR(info.st_mode)
              or stat.S_ISLNK(info.st_mode)
              or info.st_uid != os.geteuid()
              or stat.S_IMODE(info.st_mode) != 0o700
          ):
              raise SystemExit("private reviewed source root is unsafe")
          PY
          git_bootstrap() {
            /usr/bin/env -i \
              PATH=/usr/bin:/bin \
              HOME="${RUNNER_TEMP}" \
              LANG=C \
              LC_ALL=C \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_SYSTEM=/dev/null \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_ATTR_NOSYSTEM=1 \
              GIT_NO_REPLACE_OBJECTS=1 \
              GIT_OPTIONAL_LOCKS=0 \
              GIT_TERMINAL_PROMPT=0 \
              GIT_PROTOCOL_FROM_USER=0 \
              GIT_ALLOW_PROTOCOL=https \
              /usr/bin/git \
              -c core.fsmonitor=false \
              -c core.untrackedCache=false \
              -c core.excludesFile=/dev/null \
              -c core.attributesFile=/dev/null \
              -c core.hooksPath=/dev/null \
              -c gc.auto=0 \
              "$@"
          }
          git_bootstrap init --quiet "${reviewed_source}"
          git_private() {
            git_bootstrap \
              --git-dir="${reviewed_source}/.git" \
              --work-tree="${reviewed_source}" \
              "$@"
          }
          readonly canonical_repository_url="https://github.com/fredgnr/local-context-forge.git"
          readonly reviewed_source_ref="refs/lcf-reviewed/source"
          git_private fetch --no-tags --force --no-write-fetch-head \
            "${canonical_repository_url}" \
            "+${LCF_SOURCE_SHA}:${reviewed_source_ref}"
          git_private checkout --quiet --detach "${reviewed_source_ref}"
          test "$(git_private rev-parse HEAD)" = "${LCF_SOURCE_SHA}"
          provenance_env="${RUNNER_TEMP}/lcf-reviewed-source-provenance.env"
          test ! -e "${provenance_env}"
          (
            cd "${reviewed_source}"
            "${bootstrap_python}" -I tools/check_exact_git_provenance.py \
              --emit-github-env > "${provenance_env}"
          )
          test "$(wc -l < "${provenance_env}")" -eq 5
          cat "${provenance_env}" >> "${GITHUB_ENV}"
          printf 'LCF_REVIEWED_SOURCE_ROOT=%s\n' \
            "${reviewed_source}" >> "${GITHUB_ENV}"
          printf 'LCF_REVIEWED_BUILD_PYTHON=%s\n' \
            "/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13" \
            >> "${GITHUB_ENV}"

      - name: Set up locked Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.23.2"

      - name: Enforce engineering-smoke packaging policy
        run: cd "${LCF_REVIEWED_SOURCE_ROOT}" && make packaged-smoke-policy-check

      - name: Download locked Python runtime sources
        shell: bash
        run: |
          set -euo pipefail
          cd "${LCF_REVIEWED_SOURCE_ROOT}"
          python_archive="${RUNNER_TEMP}/python-3.13.14-darwin-arm64.tar.gz"
          python_hashes="${RUNNER_TEMP}/python-3.13.14-hashes.sha256"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${python_archive}" \
            "https://github.com/actions/python-versions/releases/download/3.13.14-27320626148/python-3.13.14-darwin-arm64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${python_hashes}" \
            "https://github.com/actions/python-versions/releases/download/3.13.14-27320626148/hashes.sha256"
          printf '%s  %s\n' \
            "839b14df8a24415e17d15f222e2ac01d3a90845deb39df642e2cc01869140a34" \
            "${python_archive}" |
            shasum -a 256 --check
          printf '%s  %s\n' \
            "b4dd388b14ff20ced93003e31e2be8d486049456161fc1ea393aa7c64a000e17" \
            "${python_hashes}" |
            shasum -a 256 --check
          {
            printf 'PYTHON_SIDECAR_ARCHIVE=%s\n' "${python_archive}"
            printf 'PYTHON_SIDECAR_HASH_MANIFEST=%s\n' "${python_hashes}"
            printf 'LCF_PYTHON_DISTRIBUTION_ARCHIVE=%s\n' "${python_archive}"
            printf 'LCF_PYTHON_DISTRIBUTION_HASH_MANIFEST=%s\n' "${python_hashes}"
            printf 'LCF_PYTHON_INSTALL_ROOT=%s\n' \
              "/Library/Frameworks/Python.framework/Versions/3.13"
          } >> "${GITHUB_ENV}"

      - name: Build and audit locked Python sidecar
        run: cd "${LCF_REVIEWED_SOURCE_ROOT}" && make python-sidecar-build

      - name: Validate Python scratch cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          [[ "${RUNNER_TEMP}" = /* ]]
          test -d "${RUNNER_TEMP}"
          test ! -L "${RUNNER_TEMP}"
          runner_temp_real="$(cd "${RUNNER_TEMP}" && /bin/pwd -P)"
          test "${runner_temp_real}" = "${RUNNER_TEMP}"
          test "$(/usr/bin/stat -f '%u' "${RUNNER_TEMP}")" = "$(/usr/bin/id -u)"
          runner_temp_mode="$(/usr/bin/stat -f '%Lp' "${RUNNER_TEMP}")"
          (( (8#${runner_temp_mode} & 0022) == 0 ))
          ! compgen -G "${RUNNER_TEMP}/python-sidecar-toolchain-*" > /dev/null
          ! compgen -G "${RUNNER_TEMP}/lcf-python-installer.*" > /dev/null
          cd "${LCF_REVIEWED_SOURCE_ROOT:?reviewed source root was not bound}"
          test ! -e desktop/generated/python-sidecar-build
          test ! -L desktop/generated/python-sidecar-build
          ! compgen -G 'desktop/generated/python-sidecar-build-*' > /dev/null

      - name: Validate Python sidecar provenance
        shell: bash
        run: |
          set -euo pipefail
          cd "${LCF_REVIEWED_SOURCE_ROOT}"
          [[ "${LCF_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${LCF_SOURCE_TREE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${LCF_SOURCE_SNAPSHOT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${LCF_SOURCE_DATE_EPOCH}" =~ ^[0-9]+$ ]]
          [[ "${LCF_RENDERER_PACKAGE_LOCK_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${LCF_REVIEWED_BUILD_PYTHON}" = \
            "/Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13"
          test -f "${LCF_REVIEWED_BUILD_PYTHON}"
          test ! -L "${LCF_REVIEWED_BUILD_PYTHON}"
          test -x "${LCF_REVIEWED_BUILD_PYTHON}"
          test "$("${LCF_REVIEWED_BUILD_PYTHON}" -I -c \
            'import os,sys; print(os.path.realpath(sys.executable))')" = \
            "${LCF_REVIEWED_BUILD_PYTHON}"
          test "$("${LCF_REVIEWED_BUILD_PYTHON}" -I -c \
            'import platform; print(platform.python_version())')" = "3.13.14"

      - name: Build and stage audited renderer
        shell: bash
        run: |
          set -euo pipefail
          cd "${LCF_REVIEWED_SOURCE_ROOT}"
          npm_command="$(command -v npm)"
          node_directory="$(dirname "$(command -v node)")"
          test -x "${npm_command}"
          run_exact_npm_script() (
            local package_root="$1"
            local script_name="$2"
            local npm_home
            readonly npm_home_prefix="${RUNNER_TEMP}/lcf-npm-run-home."
            npm_home="$(
              /usr/bin/mktemp -d \
                "${npm_home_prefix}XXXXXXXXXX"
            )"
            chmod 0700 "${npm_home}"
            cleanup_exact_npm_home() {
              local exit_status=$?
              trap - EXIT
              if [[ "${npm_home}" != "${npm_home_prefix}"* ]] ||
                [[ ! -d "${npm_home}" ]] ||
                [[ -L "${npm_home}" ]]; then
                exit 97
              fi
              rm -rf -- "${npm_home}"
              if [[ -e "${npm_home}" ]] || [[ -L "${npm_home}" ]]; then
                exit 97
              fi
              exit "${exit_status}"
            }
            trap cleanup_exact_npm_home EXIT
            ( umask 077; : > "${npm_home}/global.npmrc" )
            ( umask 077; : > "${npm_home}/user.npmrc" )
            /usr/bin/env -i \
              PATH="${node_directory}:/usr/bin:/bin" \
              HOME="${npm_home}" \
              TMPDIR="${npm_home}" \
              CI=true \
              LCF_ENGINEERING_SMOKE=true \
              LCF_SOURCE_SHA="${LCF_SOURCE_SHA}" \
              LCF_SOURCE_TREE="${LCF_SOURCE_TREE}" \
              LCF_SOURCE_SNAPSHOT_SHA256="${LCF_SOURCE_SNAPSHOT_SHA256}" \
              LCF_SOURCE_DATE_EPOCH="${LCF_SOURCE_DATE_EPOCH}" \
              LCF_RENDERER_PACKAGE_LOCK_SHA256="${LCF_RENDERER_PACKAGE_LOCK_SHA256}" \
              LCF_REVIEWED_BUILD_PYTHON="${LCF_REVIEWED_BUILD_PYTHON}" \
              LCF_REVIEWED_SOURCE_ROOT="${LCF_REVIEWED_SOURCE_ROOT}" \
              LCF_WEB_NODE_INSTALL_SEAL="${LCF_WEB_NODE_INSTALL_SEAL:-}" \
              NPM_CONFIG_AUDIT=false \
              NPM_CONFIG_CACHE="${npm_home}/cache" \
              NPM_CONFIG_FUND=false \
              NPM_CONFIG_GLOBALCONFIG="${npm_home}/global.npmrc" \
              NPM_CONFIG_IGNORE_SCRIPTS=true \
              NPM_CONFIG_UPDATE_NOTIFIER=false \
              NPM_CONFIG_USERCONFIG="${npm_home}/user.npmrc" \
              "${npm_command}" --prefix "${package_root}" \
              run "${script_name}"
          )
          web_test_seal="${RUNNER_TEMP}/lcf-web-node-test-seal.json"
          web_final_seal="${RUNNER_TEMP}/lcf-web-node-final-seal.json"
          test ! -e "${web_test_seal}"
          test ! -e "${web_final_seal}"
          node tools/exact_node_install.cjs install \
            --package-root web \
            --seal "${web_test_seal}" \
            --npm "${npm_command}"
          run_exact_npm_script web typecheck
          node tools/exact_node_install.cjs discard-test \
            --package-root web \
            --seal "${web_test_seal}"
          node tools/exact_node_install.cjs install \
            --package-root web \
            --seal "${web_final_seal}" \
            --npm "${npm_command}"
          export LCF_WEB_NODE_INSTALL_SEAL="${web_final_seal}"
          run_exact_npm_script web build:packaging
          node tools/exact_node_install.cjs verify \
            --package-root web \
            --seal "${LCF_WEB_NODE_INSTALL_SEAL}"
          make renderer-stage
          node tools/exact_node_install.cjs verify \
            --package-root web \
            --seal "${LCF_WEB_NODE_INSTALL_SEAL}"
          printf 'LCF_WEB_NODE_INSTALL_SEAL=%s\n' \
            "${LCF_WEB_NODE_INSTALL_SEAL}" >> "${GITHUB_ENV}"

      - name: Build and test engineering-smoke Desktop profile
        shell: bash
        run: |
          set -euo pipefail
          cd "${LCF_REVIEWED_SOURCE_ROOT}"
          npm_command="$(command -v npm)"
          node_directory="$(dirname "$(command -v node)")"
          test -x "${npm_command}"
          run_exact_npm_script() (
            local package_root="$1"
            local script_name="$2"
            local npm_home
            readonly npm_home_prefix="${RUNNER_TEMP}/lcf-npm-run-home."
            npm_home="$(
              /usr/bin/mktemp -d \
                "${npm_home_prefix}XXXXXXXXXX"
            )"
            chmod 0700 "${npm_home}"
            cleanup_exact_npm_home() {
              local exit_status=$?
              trap - EXIT
              if [[ "${npm_home}" != "${npm_home_prefix}"* ]] ||
                [[ ! -d "${npm_home}" ]] ||
                [[ -L "${npm_home}" ]]; then
                exit 97
              fi
              rm -rf -- "${npm_home}"
              if [[ -e "${npm_home}" ]] || [[ -L "${npm_home}" ]]; then
                exit 97
              fi
              exit "${exit_status}"
            }
            trap cleanup_exact_npm_home EXIT
            ( umask 077; : > "${npm_home}/global.npmrc" )
            ( umask 077; : > "${npm_home}/user.npmrc" )
            /usr/bin/env -i \
              PATH="${node_directory}:/usr/bin:/bin" \
              HOME="${npm_home}" \
              TMPDIR="${npm_home}" \
              CI=true \
              LCF_ENGINEERING_SMOKE=true \
              LCF_SOURCE_SHA="${LCF_SOURCE_SHA}" \
              LCF_SOURCE_TREE="${LCF_SOURCE_TREE}" \
              LCF_SOURCE_SNAPSHOT_SHA256="${LCF_SOURCE_SNAPSHOT_SHA256}" \
              LCF_SOURCE_DATE_EPOCH="${LCF_SOURCE_DATE_EPOCH}" \
              LCF_RENDERER_PACKAGE_LOCK_SHA256="${LCF_RENDERER_PACKAGE_LOCK_SHA256}" \
              LCF_REVIEWED_BUILD_PYTHON="${LCF_REVIEWED_BUILD_PYTHON}" \
              LCF_REVIEWED_SOURCE_ROOT="${LCF_REVIEWED_SOURCE_ROOT}" \
              LCF_DESKTOP_NODE_INSTALL_SEAL="${LCF_DESKTOP_NODE_INSTALL_SEAL:-}" \
              NPM_CONFIG_AUDIT=false \
              NPM_CONFIG_CACHE="${npm_home}/cache" \
              NPM_CONFIG_FUND=false \
              NPM_CONFIG_GLOBALCONFIG="${npm_home}/global.npmrc" \
              NPM_CONFIG_IGNORE_SCRIPTS=true \
              NPM_CONFIG_UPDATE_NOTIFIER=false \
              NPM_CONFIG_USERCONFIG="${npm_home}/user.npmrc" \
              "${npm_command}" --prefix "${package_root}" \
              run "${script_name}"
          )
          desktop_test_seal="${RUNNER_TEMP}/lcf-desktop-node-test-seal.json"
          desktop_final_seal="${RUNNER_TEMP}/lcf-desktop-node-final-seal.json"
          test ! -e "${desktop_test_seal}"
          test ! -e "${desktop_final_seal}"
          node tools/exact_node_install.cjs install \
            --package-root desktop \
            --seal "${desktop_test_seal}" \
            --npm "${npm_command}"
          run_exact_npm_script desktop typecheck
          run_exact_npm_script desktop test:engineering-smoke
          node tools/exact_node_install.cjs discard-test \
            --package-root desktop \
            --seal "${desktop_test_seal}"
          node tools/exact_node_install.cjs install \
            --package-root desktop \
            --seal "${desktop_final_seal}" \
            --npm "${npm_command}"
          export LCF_DESKTOP_NODE_INSTALL_SEAL="${desktop_final_seal}"
          run_exact_npm_script desktop build:engineering-smoke
          node tools/exact_node_install.cjs verify \
            --package-root desktop \
            --seal "${LCF_DESKTOP_NODE_INSTALL_SEAL}"
          printf 'LCF_DESKTOP_NODE_INSTALL_SEAL=%s\n' \
            "${LCF_DESKTOP_NODE_INSTALL_SEAL}" >> "${GITHUB_ENV}"

      - name: Assemble and statically audit app directory
        shell: bash
        run: |
          set -euo pipefail
          cd "${LCF_REVIEWED_SOURCE_ROOT}"
          node tools/exact_node_install.cjs verify \
            --package-root web \
            --seal "${LCF_WEB_NODE_INSTALL_SEAL}"
          node tools/exact_node_install.cjs verify \
            --package-root desktop \
            --seal "${LCF_DESKTOP_NODE_INSTALL_SEAL}"
          node desktop/scripts/prepareEngineeringSmoke.cjs
          (
            cd desktop
            CSC_FOR_PULL_REQUEST=true \
              ./node_modules/.bin/electron-builder \
              --dir --mac --arm64 \
              --config electron-builder.smoke.yml \
              --publish never
          )
          audit_json="${RUNNER_TEMP}/engineering-smoke-audit.json"
          node desktop/scripts/auditEngineeringSmokeBundle.cjs > "${audit_json}"
          node - "${audit_json}" <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expected = {
            assembly: "pass",
            bundleAudit: "pass",
            validationId: "VAL-PACKAGED-SMOKE-001",
            packagedAppLaunch: "not-run",
            packagedSmokeValidation: "not-run",
            w10: "locked",
            w11: "locked"
          };
          for (const [key, expectedValue] of Object.entries(expected)) {
            if (value.validation?.[key] !== expectedValue) {
              throw new Error(`Engineering-smoke audit marker ${key} is invalid`);
            }
          }
          NODE
          node tools/exact_node_install.cjs verify \
            --package-root web \
            --seal "${LCF_WEB_NODE_INSTALL_SEAL}"
          node tools/exact_node_install.cjs verify \
            --package-root desktop \
            --seal "${LCF_DESKTOP_NODE_INSTALL_SEAL}"
          "${LCF_REVIEWED_BUILD_PYTHON}" -I \
            tools/check_exact_git_provenance.py > /dev/null
          cat "${audit_json}"
          {
            printf '## Engineering-smoke assembly only\n\n'
            printf -- '- source: `%s`\n' "${LCF_SOURCE_SHA}"
            printf -- '- GitHub context SHA: `%s`\n' "${LCF_GITHUB_CONTEXT_SHA}"
            printf -- '- packaged App launch: `not-run`\n'
            printf -- '- `VAL-PACKAGED-SMOKE-001`: `not-run`\n'
            printf -- '- W10/W11: `locked`\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run focused Python sidecar lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          cd "${LCF_REVIEWED_SOURCE_ROOT}"
          export PYTHONDONTWRITEBYTECODE=1
          python -B -m pip install --disable-pip-version-check uv==0.11.29
          make ci-python-install
          backend/.venv/bin/python -B -m pytest -q \
            tests/backend/test_python_sidecar_packaging.py
