[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-context-forge-backend"
version = "0.3.0a1"
description = "Evidence-first local Context7 replacement backend"
requires-python = ">=3.11"
dependencies = [
  "certifi==2026.7.22",
  "dulwich==1.2.11",
  "fastapi>=0.115,<1",
  "h11==0.16.0",
  "pydantic>=2.10,<3",
  "urllib3==2.7.0",
  "uvicorn>=0.34,<1",
]

[project.scripts]
lcf-service = "app.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../tests/backend"]
pythonpath = ["."]
