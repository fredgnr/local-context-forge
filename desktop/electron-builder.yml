appId: dev.local-context-forge.desktop
productName: Local Context Forge
asar: true
npmRebuild: false
electronVersion: 43.2.0
beforePack: scripts/beforePack.cjs
afterPack: scripts/afterPack.cjs
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - README.md
extraResources:
  - from: resources/renderer
    to: renderer
    filter:
      - "**/*"
  - from: generated/sidecar
    to: sidecar
    filter:
      - "**/*"
  - from: generated/companion
    to: companion
    filter:
      - "**/*"
  - from: companion
    to: companion
    filter:
      - "THIRD_PARTY_NOTICES.txt"
  - from: generated/qmd
    to: qmd
    filter:
      - "**/*"
  - from: resources/update
    to: update
    filter:
      - "update-metadata-ed25519-public.pem"
  - from: ../runtime
    to: update
    filter:
      - "update-metadata-key.lock.json"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  identity: "-"
  timestamp: none
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  signIgnore:
    - "/Contents/Resources/sidecar/"
    - "/Contents/Resources/qmd/"
dmg:
  writeUpdateInfo: false
artifactName: "local-context-forge-${version}-${arch}-UNOFFICIAL.${ext}"
