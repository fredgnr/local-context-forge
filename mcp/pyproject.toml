[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-context-forge-mcp"
version = "0.1.0"
description = "Context7-compatible MCP gateway for Local Context Forge"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp==1.28.1",
]

[project.scripts]
local-context-forge-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*"]
